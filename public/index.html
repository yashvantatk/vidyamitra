<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VidyaMitra · Tamil-first AI tutor</title>
<style>
  :root { --wa:#075E54; --bg:#ECE5DD; --me:#DCF8C6; --orange:#F07B3A; --navy:#2B3A55; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Noto Sans Tamil", "Nirmala UI", sans-serif; background:#f4f1ec; display:flex; justify-content:center; }
  .app { width:100%; max-width:480px; height:100vh; display:flex; flex-direction:column; background:var(--bg); box-shadow:0 0 30px rgba(0,0,0,.12); }
  header { background:var(--wa); color:#fff; padding:12px 16px; display:flex; gap:12px; align-items:center; }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--orange); display:grid; place-items:center; font-weight:700; }
  header small { opacity:.8; display:block; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:82%; padding:8px 10px; border-radius:8px; white-space:pre-wrap; line-height:1.4; font-size:15px; box-shadow:0 1px 1px rgba(0,0,0,.1); }
  .bot { background:#fff; align-self:flex-start; }
  .me { background:var(--me); align-self:flex-end; }
  .msg img { max-width:100%; border-radius:6px; display:block; margin-bottom:4px; }
  .typing { color:#777; font-style:italic; }
  form { display:flex; gap:8px; padding:10px; background:#f0f0f0; align-items:center; }
  #text { flex:1; padding:10px 14px; border-radius:20px; border:none; font-size:15px; }
  button, label.btn { border:none; background:#25D366; color:#fff; width:42px; height:42px; border-radius:50%; font-size:18px; cursor:pointer; display:grid; place-items:center; }
  label.btn { background:var(--navy); }
  .chips { display:flex; gap:6px; padding:0 10px 8px; background:#f0f0f0; flex-wrap:wrap; }
  .chip { background:#fff; border:1px solid #ddd; border-radius:14px; padding:4px 10px; font-size:13px; cursor:pointer; }
  .note { font-size:12px; text-align:center; color:#666; padding:4px; }
</style>
</head>
<body>
<div class="app">
  <header><div class="avatar">V</div><div><b>VidyaMitra</b><small>Web demo · same brain as the WhatsApp bot</small></div></header>
  <div id="log"></div>
  <div class="chips">
    <span class="chip">class 8</span><span class="chip">tamil</span><span class="chip">english</span>
    <span class="chip">2x + 5 = 15 எப்படி?</span><span class="chip">What is photosynthesis?</span><span class="chip">reset</span>
  </div>
  <form id="f">
    <label class="btn" title="Send a homework photo">📷<input id="file" type="file" accept="image/*" hidden /></label>
    <input id="text" placeholder="Type a doubt in Tamil or English…" autocomplete="off" />
    <button title="Send">➤</button>
  </form>
  <div class="note">Demo only. Do not share personal details.</div>
</div>
<script>
  const log = document.getElementById('log');
  const uid = localStorage.vmUid || (localStorage.vmUid = Math.random().toString(36).slice(2));
  function add(text, cls, img) {
    const d = document.createElement('div'); d.className = 'msg ' + cls;
    if (img) { const i = document.createElement('img'); i.src = img; d.appendChild(i); }
    if (text) d.appendChild(document.createTextNode(text.replace(/\*(.+?)\*/g, '$1')));
    log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
  }
  async function send(text, image, preview) {
    add(text, 'me', preview);
    const t = add('typing…', 'bot typing');
    try {
      const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ userId: uid, text, image }) });
      const j = await r.json(); t.remove(); add(j.reply || j.error, 'bot');
    } catch (e) { t.remove(); add('Network error, please try again.', 'bot'); }
  }
  document.getElementById('f').onsubmit = (e) => { e.preventDefault(); const i = document.getElementById('text'); if (!i.value.trim()) return; send(i.value.trim()); i.value=''; };
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));
  document.getElementById('file').onchange = (e) => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { const url = rd.result; const b64 = url.split(',')[1]; const caption = document.getElementById('text').value.trim(); document.getElementById('text').value=''; send(caption, { mimeType: f.type, base64: b64 }, url); };
    rd.readAsDataURL(f); e.target.value='';
  };
  add('வணக்கம்! நான் VidyaMitra 📚\nType a doubt, tap a chip, or send a homework photo 📷', 'bot');
</script>
</body>
</html>
